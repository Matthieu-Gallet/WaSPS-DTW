# River-discharge reference run — full scale, no sample cap
# Run: python experiments/run_classification.py configs/river_full.yaml
#
# Differences from configs/river.yaml:
#   - max_train_samples: -1 / max_test_samples: -1  (no cap → 80 train / 20 test per class)
#   - k_values: [1, 10]  (KNN tested at both k=1 and k=10; barycenter is K-independent)
#   - debug: true  (writes dataset_report.log, samples_pdf per class, barycenter plots + .npy)
#   - output: results/jax_river_full
#
# STA excluded: O(T²·n_train·n_test) without batching — intractable at T=365.
# For STA comparison use configs/river_sta.yaml (T=25 truncated, capped samples).
#
# Estimated runtime (3 methods × 2 modes × 4 seeds, 80 train/class × T=365):
#   KNN  (vmap): ~1-2 min per method per seed
#   Bary (adam): ~20-40 min per method per seed (200 steps, patience=20)
#   Total: ~4-6 h background job

dataset:
  type: river
  family: exponential
  data_dir: data/river
  mode: balanced          # 400 samples, T=365 daily, 4 classes (100/class)
  test_size: 0.2          # stratified → 80 train / 20 test per class (no cap)
  max_time_steps: null    # full T=365 — do not truncate

classification:
  gamma: 1.0
  k_values: [1, 10]       # KNN tested at k=1 and k=10; barycenter is K-independent
  n_steps: 200
  lr: 0.01
  max_train_samples: -1   # no cap (80 train per class)
  max_test_samples: -1    # no cap (20 test per class)
  samples_per_step: 50    # rectangularise raw → (T, 50) for eucl_raw representation
  early_stop_patience: 20
  early_stop_tol: 1.0e-4

methods: [wasps, eucl_params, eucl_raw]
modes:   [knn, barycenter]

n_seeds: 4
seed: 42

debug: true               # dataset_report.log + samples_pdf + bary plots + .npy (first seed)

output:
  dir: results/jax_river_full
