# River aggregation sweep — baseline (agg=1 jour, gamma=10)
# Sert de référence gamma=10 vs river_bary_debug.yaml (gamma=1).
# Run: python experiments/run_classification.py configs/river_agg1.yaml

dataset:
  type: river
  family: exponential
  data_dir: data/river
  mode: balanced
  test_size: 0.2
  max_time_steps: null
  aggregate_days: 1      # pas d'aggregation — T=365, ~87 valides/timestep

classification:
  gamma: 10.0
  k_values: [1]
  n_steps: 200
  lr: 0.01
  max_train_samples: -1
  max_test_samples: -1
  samples_per_step: 50   # 50 samples/jour (inchangé)
  early_stop_patience: 20
  early_stop_tol: 1.0e-4

methods: [wasps, eucl_params, eucl_raw]
modes:   [knn, barycenter]

n_seeds: 1
seed: 42
debug: true

output:
  dir: results/jax_river_agg1
