# Gamma-search step shared by Experiment 1 (KNN) and Experiment 1bis (barycenter) —
# experiments/optimize_gamma.py reads this file plus configs/exp1_baseline.yaml (for the
# 7-method list and per-dataset sample scale) and writes one best_params.json per dataset.
#
# Run: python experiments/optimize_gamma.py --config configs/exp1_baseline.yaml \
#          --gamma-search-config configs/gamma_search.yaml --dataset both

gamma_grid: [1.0e-4, 1.0e-2, 1.0e-1, 1.0, 1.0e+1, 1.0e+2, 1.0e+4]
n_seeds: 3

# STA-only reduced-scale overrides — used ONLY for STA's own gamma-search calls (both knn and
# barycenter modes), never for the main Experiment 1 / 1bis runs (which use full scale for
# every method, including STA). cpazmal test cap: max_test_per_class=1 -> ~7 total across
# cpazmal's 7 classes. river test cap: max_test_samples=8 = 2 x 4 classes.
sta_reduced:
  cpazmal:
    samples_per_step: 8
    max_train_per_class: 3
    max_test_per_class: 1
  river:
    samples_per_step: 8
    max_train_samples: 12
    max_test_samples: 8

output:
  dir: results/gamma_search
