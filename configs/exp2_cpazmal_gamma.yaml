# Experiment 2 — cpazmal only, KNN only, all 7 gamma values, 10 holdout seeds (42-51).
# Compares the 7 methods as a function of gamma with solid statistics. Reuses cpazmal's
# sample settings from configs/full_baseline.yaml (samples_per_step=64, 15/25 per-class
# caps) — unchanged so the 4 already-computed seeds (42-45, migrated from
# results/jax_full_baseline/ by experiments/migrate_exp2_seeds.py) stay valid; the
# seed-level resume in run_full_baseline.py computes only the missing 6 seeds (46-51).
#
# Run: ./exp2_cpazmal_gamma.sh (preferred) or directly:
#   python experiments/run_full_baseline.py --config configs/exp2_cpazmal_gamma.yaml \
#       --dataset cpazmal --modes knn --n-jobs 4 --sta-n-jobs 2

methods: [wasps, wasps_nodiv, eucl_params, eucl_params_nodiv, eucl_raw, eucl_raw_nodiv, sta]
n_seeds: 5
estimator: log_cumulant

cpazmal:
  dataset:
    type: cpazmal
    family: weibull
    hdf5_path: /home/mgallet/Documents/Codes/Python/1_DONE/CPAZMAL/DATASET/dataset_original/PAZTSX_CRYO_ML.hdf5
    max_groups_per_class: null
    window_size: 9
  classification:
    gamma_values: [1.0e-3, 1.0e-2, 1.0e-1, 1.0, 1.0e+1, 1.0e+2, 1.0e+4]
    k: 1
    sta_epsilon: 0.05
    lr: 0.05
    samples_per_step: 48
    max_train_per_class: 15
    max_test_per_class: 25

output:
  dir: results/jax_exp2_cpazmal_gamma
