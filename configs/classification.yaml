# Experiment config — synthetic exponential classification (4 methods × 2 modes)
# Run: python experiments/run_classification.py configs/classification.yaml

dataset:
  type: synthetic          # synthetic | river | cpazmal
  family: exponential
  n_classes: 3
  n_train_per_class: 8
  n_test_per_class: 4
  T: 6                     # number of timesteps
  N_samples: 50            # samples per timestep per series
  rate_params: [1.0, 3.0, 7.0]   # rate β per class

classification:
  gamma: 1.0
  k: 1
  n_steps: 150
  lr: 0.01
  sta_epsilon: 0.05

methods: [wasps, eucl_params, eucl_raw, sta]
modes:   [knn, barycenter]

n_seeds: 4
seed: 42

output:
  dir: results/jax_classification
