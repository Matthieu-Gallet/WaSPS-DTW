# Sensitivity analysis config — river (real data only, no synthetic sweeps)
# Run: python experiments/run_sensitivity.py --config configs/sensitivity_river.yaml --scenario <name>
# Scenarios: grid_knn, grid_bary, sweep_n_samples, sweep_n_train, sweep_decimation, final_comparison
# final_comparison also needs: --cpazmal-config configs/sensitivity_cpazmal.yaml
#
# Order to run: grid_knn, grid_bary  →  (writes results/jax_sensitivity/best_params.json)
#               sweep_n_samples, sweep_n_train, sweep_decimation  (read best_params.json)
#               final_comparison  (independent — fixed gamma/k, not calibrated)
#
# aggregate_days=7 (T=52) applies to EVERY scenario here (dataset-level, not just
# final_comparison) — keeps T consistent across the whole sensitivity study and
# keeps STA tractable in final_comparison.

dataset:
  type: river
  family: exponential
  data_dir: data/river
  mode: balanced        # 800 samples, 4 classes, 183 groups (min 7/class — see configs/classification/river.yaml)
  max_time_steps: null
  aggregate_days: 7      # → T=52, matches analysis/river_barycenter_agg4.ipynb

classification:
  gamma: 1.0             # overridden per grid point by grid_knn/grid_bary
  k: 1
  n_steps: 500
  lr: 0.01
  sta_epsilon: 0.05
  samples_per_step: 50
  early_stop_patience: 20
  early_stop_tol: 1.0e-4
  optimizer: sgd

cross_validation:
  n_splits: 5
  fold: -1
  group_aware: true
  cv_seed: 42
  n_seeds_per_fold: 2    # 2 seeds × 5 folds = 10 runs per grid point / sweep value

seed: 42

sensitivity:
  methods: [wasps, eucl_params, eucl_raw]   # STA excluded from grids/sweeps (O(T²) cost)
  n_steps_bary: 500                          # barycenter fit steps used by grid_bary + bary-mode sweeps

  grid_knn:
    k_values:     [1, 5, 22, 100]             # geomspace(1, 100, 4), rounded
    gamma_values: [1.0e-4, 1.0, 10.0, 1.0e4]
    max_train_per_class: 80
    max_test_per_class: 20

  grid_bary:
    lr_values:    [0.001, 0.005, 0.01, 0.05, 0.1]
    gamma_values: [1.0e-4, 1.0, 10.0, 1.0e4]
    max_train_per_class: 80
    max_test_per_class: 20

  sweep_n_samples:
    values: [5, 8, 15, 25, 40, 48]   # min_valid=5 floor .. to_fixed_n's natural per-series ceiling
    max_train_per_class: 80
    max_test_per_class: 20

  sweep_n_train:
    values: [2, 4, 6, 8, 12, 16, 24]   # samples per class (train) — k clamps automatically at low N
    samples_per_step: 48
    max_test_per_class: 20

  sweep_decimation:
    fractions: [0.0, 0.05, 0.10, 0.20, 0.30, 0.50]
    samples_per_step: 48
    max_train_per_class: 80
    max_test_per_class: 20

  final_comparison:
    methods: [wasps, eucl_params, eucl_raw, sta]
    gamma: 1.0       # fixed, shared across all 4 methods — not calibrated (STA has no grid_knn entry)
    k: 1
    samples_per_step: 48
    max_train_per_class: 80
    max_test_per_class: 20

output:
  dir: results/jax_sensitivity
