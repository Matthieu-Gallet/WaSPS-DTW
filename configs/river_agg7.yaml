# River aggregation sweep — 7 jours / hebdomadaire (gamma=10)
# T=365//7=52 timesteps, 100*7=700 valeurs brutes/timestep → ~609 valides → samples_per_step=350
# Run: python experiments/run_classification.py configs/river_agg7.yaml

dataset:
  type: river
  family: exponential
  data_dir: data/river
  mode: balanced
  test_size: 0.2
  max_time_steps: null
  aggregate_days: 7      # T=52, ~609 valides/timestep (hebdomadaire)

classification:
  gamma: 10.0
  k_values: [1]
  n_steps: 200
  lr: 0.01
  max_train_samples: -1
  max_test_samples: -1
  samples_per_step: 350  # 50*7 — exploite les samples aggregés
  early_stop_patience: 20
  early_stop_tol: 1.0e-4

methods: [wasps, eucl_params, eucl_raw]
modes:   [knn, barycenter]

n_seeds: 1
seed: 42
debug: true

output:
  dir: results/jax_river_agg7
