# Experiment 1 — river + cpazmal method comparison, KNN and barycenter modes, fixed
# gamma=1.0 (no sweep — see configs/exp2_cpazmal_gamma.yaml for the gamma-vs-method
# study). 5 holdout seeds (42-46), all 7 methods in KNN mode; barycenter mode fits
# the 6 non-STA methods (STA-barycenter is not tractable at this sample scale — an
# empirical timing gate on one cpazmal fold showed >150s for 2 gradient steps of ONE
# class/seed; see experiments/run_full_baseline.py module docstring). STA's own
# barycenter appears only in the dedicated 2-class river figure (exp1.sh's last step),
# computed narrowly outside this sweep.
#
# River sample caps (max_train_samples/max_test_samples, FLAT totals not per-class):
# set to match cpazmal's own per-class totals (15/25 x 7 classes = 105/175) so both
# datasets compare on the same total sample count despite river having 4 classes vs
# cpazmal's 7.
#
# Run: ./exp1_river_baseline.sh (preferred) or directly:
#   python experiments/run_full_baseline.py --config configs/exp1_baseline.yaml \
#       --modes knn,barycenter --n-jobs 4 --sta-n-jobs 2

methods: [wasps, wasps_nodiv, eucl_params, eucl_params_nodiv, eucl_raw, eucl_raw_nodiv, sta]
bary_methods: [wasps, wasps_nodiv, eucl_params, eucl_params_nodiv, eucl_raw, eucl_raw_nodiv]
n_seeds: 5
estimator: log_cumulant

river:
  dataset:
    type: river
    family: exponential
    data_dir: data/river
    mode: balanced
    max_time_steps: null
    aggregate_days: 7        # T=52
  classification:
    gamma: 1.0
    k: 1
    sta_epsilon: 0.05
    samples_per_step: 48     # raised from 48 (2026-07-12), per-user request
    max_train_samples: 105   # flat total, matches cpazmal's 15/class x 7 classes
    max_test_samples: 175    # flat total, matches cpazmal's 25/class x 7 classes
    lr: 0.001
    n_steps_bary: 75
    optimizer: sgd
    early_stop_patience: 20
    early_stop_tol: 1.0e-4

cpazmal:
  dataset:
    type: cpazmal
    family: weibull
    hdf5_path: /home/mgallet/Documents/Codes/Python/1_DONE/CPAZMAL/DATASET/dataset_original/PAZTSX_CRYO_ML.hdf5
    max_groups_per_class: null
    window_size: 9
  classification:
    gamma: 1.0
    k: 1
    sta_epsilon: 0.05
    samples_per_step: 48
    max_train_per_class: 15
    max_test_per_class: 25
    lr: 0.05
    n_steps_bary: 75
    optimizer: sgd
    early_stop_patience: 20
    early_stop_tol: 1.0e-4

output:
  dir: results/jax_exp1_baseline
