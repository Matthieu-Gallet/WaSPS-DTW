# Experiment config — River-discharge 4-method comparison including STA (T reduced)
# Run: python experiments/run_classification.py configs/river_sta.yaml
#
# STA is O(T²): at T=365 (balanced, daily) it is intractable even at 20×20 samples.
# This config uses max_time_steps=25 to reduce T to a tractable range (~13 min/seed for KNN).
#
# Note on timing: T=52 was originally targeted (~12 min/seed estimate based on CPAZMaL T=24),
# but river Sinkhorn convergence is ~10× slower than CPAZMaL (river β ∈ [0.025, 44] creates
# large transport distances → many iterations at ε=0.05 → ~56 min/seed at T=52).
# T=25 cuts T² from 2704 to 625 → ~13 min/seed, 4 seeds ≈ 52 min total.
#
# Note: truncation to 25 daily steps covers only ~3.5 weeks — not a full seasonal cycle.
# Use configs/river.yaml (T=365, 3 methods) for the main result.

dataset:
  type: river
  family: exponential
  data_dir: data/river
  mode: balanced          # balanced: 400 samples, T=365 (daily), 4 classes
  test_size: 0.2
  max_time_steps: 25      # truncate to 25 daily steps for STA tractability (~13 min/seed)

classification:
  gamma: 1.0
  k: 1
  n_steps: 200
  lr: 0.01
  sta_epsilon: 0.05
  max_train_samples: 20   # same cap as river.yaml — equal comparison
  max_test_samples: 20
  samples_per_step: 50    # rectangularise raw arrays to (T, 50) — required for eucl_raw + STA
  early_stop_patience: 20
  early_stop_tol: 1.0e-4

methods: [wasps, eucl_params, eucl_raw, sta]
modes:   [knn]          # STA barycenter at T=25 is slow (T²=625 Sinkhorn/step); omit for now

n_seeds: 4
seed: 42

output:
  dir: results/jax_river_sta
