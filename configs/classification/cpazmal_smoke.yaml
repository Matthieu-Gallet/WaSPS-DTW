# CPAZMaL smoke test — K-fold, multi-class subset
# Run: python experiments/run_classification.py configs/cpazmal_smoke.yaml
#
# max_groups_per_class=12 keeps up to 12 ATTEMPTED groups from EVERY learning
# class (7 classes after STUDY+HAG exclusion). A flat max_groups cap would not
# span multiple classes at all: groups are sorted alphabetically overall, and
# class-name prefixes cluster alphabetically, so a small flat cap only ever
# hits one class (verified: the old max_groups=6 cache was 100% class ABL).
#
# Why 12 attempted, not 3: requiring a window to be valid across the FULL
# continuous year (T≈29) is a stricter joint condition than the old two-phase
# scheme (train/predict validity checked separately) — many groups now yield
# ZERO windows. Empirically, ~25% of attempted groups survive extraction here,
# so max_groups_per_class=12 (attempted) reliably yields ~3 SURVIVING groups
# per class — enough for cross_validation.n_splits=3 to place every class in
# every fold. A smaller attempted cap (e.g. 3) can leave some classes with 0-1
# surviving groups purely by bad luck in which specific groups get attempted,
# producing degenerate folds (a whole class missing from train or test).

dataset:
  type: cpazmal
  family: weibull
  hdf5_path: /home/mgallet/Documents/Codes/Python/1_DONE/CPAZMAL/DATASET/dataset_original/PAZTSX_CRYO_ML.hdf5
  max_groups_per_class: 12

classification:
  gamma: 1.0
  k: 1
  n_steps: 30
  lr: 0.005
  sta_epsilon: 0.05
  max_train_samples: 20
  max_test_samples: 20
  samples_per_step: 50
  early_stop_patience: 10
  early_stop_tol: 1.0e-4

methods: [wasps, eucl_params, eucl_raw]
modes:   [knn, barycenter]

cross_validation:
  n_splits: 3
  fold: -1
  group_aware: true

seed: 42

output:
  dir: results/jax_cpazmal_smoke
