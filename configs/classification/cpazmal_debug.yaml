# Debug smoke test — CPAZMaL (Weibull, barycenter mode only, 2 groups/class)
# Run: python experiments/run_classification.py configs/cpazmal_debug.yaml
#
# Enables debug=true: writes dataset_report.log + per-class histograms +
# per-method barycenter plots to results/jax_cpazmal_debug/debug/.
# max_groups_per_class=2 limits extraction to 2 groups per class (~14 groups
# total, all 7 learning classes represented) for fast iteration.
# Classification task (single continuous series per window, HAG excluded) —
# not the old train/predict temporal-prediction split.

dataset:
  type: cpazmal
  family: weibull
  hdf5_path: /home/mgallet/Documents/Codes/Python/1_DONE/CPAZMAL/DATASET/dataset_original/PAZTSX_CRYO_ML.hdf5
  max_groups_per_class: 2   # smoke test: 2 groups/class, all classes represented

classification:
  gamma: 1.0
  k: 1
  n_steps: 50          # reduced for quick smoke
  lr: 0.005
  sta_epsilon: 0.05
  max_train_samples: 20
  max_test_samples: 20
  samples_per_step: 100
  early_stop_patience: 10
  early_stop_tol: 1.0e-4

methods: [wasps, eucl_params]   # 2 methods only for smoke (no sta, no eucl_raw)
modes:   [barycenter]           # debug most useful for barycenter mode

n_seeds: 1
seed: 42

debug: true           # enables: dataset_report.log + samples_pdf + barycenter plots

output:
  dir: results/jax_cpazmal_debug
