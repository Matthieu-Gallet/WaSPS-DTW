# River-discharge classification — river_new dataset (window_size=4) with K-fold
# Dataset: data/river_new/output_4/  — 600 samples, T=365, 6 classes, 289 geographic groups
# K-fold: 5-fold StratifiedGroupKFold (groups disjoint across folds)
# fold: -1 → iterate over all 5 folds (one seed), report mean ± std
#
# Run:
#   python experiments/run_classification.py configs/river_new.yaml
#
# Smoke variant: use configs/river_new_smoke.yaml (T=8)

dataset:
  type: river
  family: exponential
  data_dir: data/river_new/output_4   # output_2 (1200s, W=2) or output_3/4 (600s, W=3/4)
  mode: balanced                       # 600 samples, T=365 daily, 6 classes
  max_time_steps: null                 # null = full T=365

classification:
  gamma: 1.0
  k: 1
  n_steps: 200
  lr: 0.01
  sta_epsilon: 0.05
  samples_per_step: 50    # rectangularise raw arrays to (T, 50) — required for eucl_raw
  max_train_samples: 30   # ~480 train / fold → cap at 30 for fast iteration
  max_test_samples: -1    # keep all ~120 test samples
  early_stop_patience: 20
  early_stop_tol: 1.0e-4

# STA excluded at T=365 (O(T²)). Add to methods and set max_time_steps: 25 for STA.
methods: [wasps, eucl_params, eucl_raw]
modes:   [knn, barycenter]

cross_validation:
  n_splits: 5
  fold: -1           # -1 = loop over all 5 folds; 0..4 = specific fold
  group_aware: true  # StratifiedGroupKFold — geographic groups disjoint across folds

seed: 42   # used when fold is fixed (not -1)

output:
  dir: results/jax_river_new_cv
