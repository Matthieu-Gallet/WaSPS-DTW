# Sensitivity analysis config — CPAZMaL, used ONLY as the second dataset for the
# final_comparison scenario (grids/sweeps are river-only per plan §3).
# Run: python experiments/run_sensitivity.py --config configs/sensitivity_river.yaml \
#          --cpazmal-config configs/sensitivity_cpazmal.yaml --scenario final_comparison
#
# NOTE: `methods`/`gamma`/`k` below are NOT read for this dataset — final_comparison()
# takes those from the river config's sensitivity.final_comparison block (the single
# shared values used for both datasets) and only reads this file's final_comparison
# block for dataset-level overrides (samples_per_step, per-class caps). Kept here
# anyway so the file is self-describing / usable standalone if that changes.

dataset:
  type: cpazmal
  family: weibull
  hdf5_path: /home/mgallet/Documents/Codes/Python/1_DONE/CPAZMAL/DATASET/dataset_original/PAZTSX_CRYO_ML.hdf5
  max_groups_per_class: null   # full cache — classification-level per-class caps do the limiting
  window_size: 12

classification:
  gamma: 1.0
  k: 1
  n_steps: 500
  lr: 0.005
  sta_epsilon: 0.05
  samples_per_step: 100
  early_stop_patience: 20
  early_stop_tol: 1.0e-4
  optimizer: sgd

cross_validation:
  n_splits: 5
  fold: -1
  group_aware: true
  cv_seed: 42
  n_seeds_per_fold: 2    # 2 seeds × 5 folds = 10 runs

seed: 42

sensitivity:
  final_comparison:
    methods: [wasps, eucl_params, eucl_raw, sta]   # unused here, see NOTE above
    gamma: 1.0                                     # unused here, see NOTE above
    k: 1                                            # unused here, see NOTE above
    # No aggregate_days: CPAZMaL's natural full-year series is already T≈29 — no
    # truncation needed to keep STA tractable (river needs aggregate_days=7 instead).
    samples_per_step: 48
    max_train_per_class: 80
    max_test_per_class: 20

output:
  dir: results/jax_sensitivity
